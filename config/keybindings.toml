profile = "Argon Montage"

[bindings]
AddAdjustmentClip = ["Alt+A"]
AddCrossDissolve = ["Ctrl+T"]
AddKeyframe = ["Alt+K"]
AddMarker = ["M"]
AddNamedMarker = ["Alt+M"]
AnalyzeBeats = ["Alt+B"]
AppendClip = ["E"]
AutoCaptions = ["Ctrl+Shift+C"]
BladeAll = ["Shift+B"]
BladeSplit = ["C", "Ctrl+B", "B"]
BladeTool = ["Ctrl+Shift+B"]
BreakApart = ["Shift+Alt+C"]
ClearSelection = ["Esc"]
ConnectClip = ["Alt+Q"]
DeleteWithGap = ["Delete", "Backspace"]
Export = ["Ctrl+E"]
GamingReframe916 = ["Alt+9"]
GoToEnd = ["End"]
GoToStart = ["Home"]
HoldFrame = ["Shift+H"]
Import = ["Ctrl+I"]
ImportFcpxml = ["Ctrl+Shift+I"]
InsertClip = ["Alt+W"]
InsertGap = ["Alt+G"]
NewCompound = ["Alt+C"]
NextEdit = ["Down"]
Open = ["Ctrl+O"]
OverwriteClip = ["D"]
PlayPause = ["Space"]
PrevEdit = ["Up"]
RangeTool = ["R"]
Redo = ["Ctrl+Shift+Z"]
RippleDelete = ["Shift+Delete", "Shift+Backspace"]
RippleTrimEnd = ["W"]
RippleTrimStart = ["Q"]
Save = ["Ctrl+S"]
SaveAs = ["Ctrl+Shift+S"]
ScanKills = ["Shift+Alt+K"]
SelectAll = ["Ctrl+A"]
SelectTool = ["A"]
ShowShortcuts = ["Ctrl+,", "F1"]
ShuttleLeft = ["J"]
ShuttleRight = ["L"]
ShuttleStop = ["K"]
StepBack = ["Left"]
StepBack10 = ["Shift+Left"]
StepForward = ["Right"]
StepForward10 = ["Shift+Right"]
SyncToBeats = ["Alt+S"]
ToggleAnimation = ["Ctrl+V"]
ToggleClipEnabled = ["V"]
ToggleCopilot = ["Ctrl+Shift+A"]
ToggleRetime = ["Ctrl+R"]
ToggleSkimming = ["Shift+S"]
ToggleSnapping = ["S", "N"]
TrimTool = ["T"]
Undo = ["Ctrl+Z"]
ZoomIn = ["Ctrl+=", "Ctrl+Plus"]
ZoomOut = ["Ctrl+-"]
ZoomToFit = ["Shift+Z"]
