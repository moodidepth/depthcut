[workspace]
resolver = "2"
members = [
    "crates/nle-core",
    "crates/nle-media",
    "crates/nle-render",
    "crates/nle-ai",
    "crates/nle-ui",
]
default-members = [
    "crates/nle-core",
    "crates/nle-media",
    "crates/nle-render",
    "crates/nle-ai",
    "crates/nle-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Rust Cut Pro contributors"]
rust-version = "1.80"

[workspace.dependencies]
nle-core = { path = "crates/nle-core" }
nle-media = { path = "crates/nle-media" }
nle-render = { path = "crates/nle-render" }
nle-ai = { path = "crates/nle-ai" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rayon = "1.10"
core_affinity = "0.8"
crossbeam = "0.8"
rtrb = "0.3"
rustfft = "6.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
whisper-rs = "0.16"
cpal = "0.15"
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
wgpu = "24"
naga = { version = "24", features = ["wgsl-in"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
ab_glyph = "0.2"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
rfd = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
# file:line in crash backtraces (Windows: goes to the separate .pdb, exe size unchanged)
debug = "line-tables-only"
